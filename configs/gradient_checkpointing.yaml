method: gradient_checkpointing
model_name: "google/gemma-3-270m"

data:
  max_samples: 200
  max_length: 128

training:
  output_dir: "./outputs"
  num_train_epochs: 3
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-5
  weight_decay: 0.01

gradient_checkpointing:
  enabled: true
  use_reentrant: false
  optim: "adamw_torch"
  max_grad_norm: 1.0
