[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-optimization-toolkit"
version = "0.1.0"
description = "Modular toolkit for LLM fine-tuning and inference optimization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "peft>=0.10.0",
    "accelerate>=0.29.0",
    "bitsandbytes>=0.43.0",
    "trl>=0.8.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "polars>=0.20.0",
    "beautifulsoup4>=4.12.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
inference = ["vllm>=0.4.0"]
deepspeed = ["deepspeed>=0.14.0"]
evaluation = ["rouge-score>=0.1.2", "nltk>=3.8.0", "evaluate>=0.4.0"]
dev = ["pytest>=8.0.0", "black>=24.0.0", "ruff>=0.3.0", "jupyter>=1.0.0", "ipykernel>=6.29.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
